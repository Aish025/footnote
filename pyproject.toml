[project]
name = "footnote"
version = "0.0.1"
description = "Product evidence intelligence: shopper questions answered from listing claims, reviews and Q&A, every claim cited, counts from SQL."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",  # GITHUB_TOKEN and tuning from .env
    "pyyaml>=6.0",             # data/manifest.yaml
    "httpx>=0.27",             # GitHub GraphQL + raw downloads (timeouts, headers)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts", "tests"]  # so ruff sorts our script modules as first-party

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
