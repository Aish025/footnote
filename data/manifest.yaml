# What the Phase 0 corpus contains. Scripts read ONLY this file for scope, so the corpus is
# reproducible: same manifest + same scripts -> same downloads, same subset, same tables.
# Validated by scripts/manifest.py.

dataset:
  name: Amazon Reviews 2023 (McAuley Lab, UC San Diego)
  homepage: https://amazon-reviews-2023.github.io/
  category: Cell_Phones_and_Accessories
  # Research-oriented use; the dataset owners do not own the underlying Amazon data.
  # Footnote uses it for a non-commercial portfolio project only.
  licence_note: Research / non-commercial use only. Underlying data belongs to Amazon and its users.

# Official McAuley Lab host. `bytes` is the expected size (Content-Length on 2026-10-10); the
# downloader refuses a file of any other size. sha256 is recorded on first download.
files:
  meta:
    url: https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/raw/meta_categories/meta_Cell_Phones_and_Accessories.jsonl.gz
    path: meta_Cell_Phones_and_Accessories.jsonl.gz
    bytes: 857990660
  reviews:
    url: https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/raw/review_categories/Cell_Phones_and_Accessories.jsonl.gz
    path: Cell_Phones_and_Accessories.jsonl.gz
    bytes: 2532539010
  # Older McAuley Q&A datasets (2016 single-answer, 2019 multi-answer). Used ONLY if their
  # ASINs overlap the v1 subset (checked by scripts/check_qa_overlap.py).
  qa_2016:
    url: https://mcauleylab.ucsd.edu/public_datasets/data/amazon/qa/qa_Cell_Phones_and_Accessories.json.gz
    path: qa_Cell_Phones_and_Accessories.json.gz
    bytes: 7109952
  qa_2019:
    url: https://mcauleylab.ucsd.edu/public_datasets/data/amazon/qa/icdm/QA_Cell_Phones_and_Accessories.json.gz
    path: QA_Cell_Phones_and_Accessories_2019.json.gz
    bytes: 18550333

# v1 subset rule (scripts/select_subset.py). Deterministic: same files + same rule -> same
# products. Rationale and measured funnel: DECISIONS.md D-011 and data/processed/subset_report.json.
subset:
  # A product belongs to the first bucket whose names appear anywhere in its category path.
  # Buckets are accessory types that invite compatibility/conflict questions.
  # (No earbuds category exists in this file; they live in the Electronics category.)
  buckets:
    chargers: ["Chargers & Power Adapters"]
    cables: ["Cables & Adapters"]
    cases: ["Basic Cases", "Flip Cases"]
    headsets: ["Single Ear Bluetooth Headsets"]
  # Listing claims are evidence: skip products with neither feature bullets nor description.
  require_listing_text: true
  # Counted in the reviews file (not Amazon's rating_number). Every selected product keeps ALL
  # its reviews, so SQL aggregates are complete; the cap stops a few 10K+-review products from
  # dominating storage and retrieval.
  min_reviews: 50
  max_reviews: 2000
  # Up to this many products per bucket, taken in sha256(salt + parent_asin) order:
  # reproducible, and not biased towards the most popular products.
  per_bucket: 1000
  order_salt: footnote-v1

# Q&A is optional evidence (CLAUDE.md): use it only if enough v1 products have any.
# scripts/check_qa_overlap.py records the overlap either way (data/processed/qa_overlap.json).
qa:
  sources: [qa_2016, qa_2019]
  min_matched_products: 50
