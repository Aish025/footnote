# What the Phase 0 corpus contains. The fetch scripts read ONLY this file, so the corpus is
# reproducible: same manifest + same scripts -> same selection. Change scope here, not in code.
# Validated by scripts/corpus.py (Manifest model).

issues:
  repo: kubernetes/kubernetes
  # Stop once this many closed issues WITH a merged fix PR are saved.
  target_count: 5000
  # Pinned window so re-runs select the same issues. Walk newest -> oldest from closed_before
  # (exclusive) down to closed_after (inclusive) and stop early when target_count is reached.
  closed_before: 2026-10-01
  closed_after: 2022-01-01
  # GitHub search returns at most 1,000 results per query, so we search in date windows.
  window_days: 14
  # Issues per GraphQL request. Bigger = fewer requests but heavier queries (502s).
  page_size: 20
  # Comments fetched inline per issue; the rest are paged in a follow-up query.
  inline_comments: 50
  # Keep only issues closed by a merged PR (the fix is our ground truth for "how was it fixed").
  require_merged_fix: true

release_notes:
  repo: kubernetes/kubernetes
  ref: master
  path_template: CHANGELOG/CHANGELOG-{version}.md
  versions: ["1.33", "1.34", "1.35", "1.36", "1.37"]

docs:
  repo: kubernetes/website
  path: content/en/docs
  # The 5 versions kubernetes.io keeps online. The current release lives on main.
  versions:
    "1.37": main
    "1.36": release-1.36
    "1.35": release-1.35
    "1.34": release-1.34
    "1.33": release-1.33
